# /etc/nginx/sites-available/arielaram.com
#
# Domínio principal: arielaram.com  (certificado Cloudflare Origin)
#   - Serve /robots.txt como arquivo estático
#   - Redireciona todo o resto para https://spsenai.arielaram.com
#
# Ativar:
#   sudo cp nginx/arielaram.com.conf /etc/nginx/sites-available/arielaram.com
#   sudo ln -s /etc/nginx/sites-available/arielaram.com \
#              /etc/nginx/sites-enabled/arielaram.com
#   sudo nginx -t && sudo nginx -s reload

# ── Zona de rate-limit ────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=arielaram_zone:10m rate=60r/m;

# ── HTTP: redirect para HTTPS ────────────────────────────────────────────────
server {
    listen 85;
    listen [::]:85;
    server_name arielaram.com www.arielaram.com;

    root /var/www/arielaram.com;

    location / {
        return 301 https://arielaram.com$request_uri;
    }
}

# ── HTTPS www → sem-www ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.arielaram.com;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    return 301 https://arielaram.com$request_uri;
}

# ── HTTPS principal ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arielaram.com;

    # ── SSL/TLS (Cloudflare Origin Certificate) ───────────────────────────────
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL_arielaram:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Cabeçalhos de segurança ───────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;

    # ── Webroot ───────────────────────────────────────────────────────────────
    root /var/www/arielaram.com;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req        zone=arielaram_zone burst=20 nodelay;
    limit_req_status 429;

    # ── robots.txt ────────────────────────────────────────────────────────────
    location = /robots.txt {
        add_header Content-Type  "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ── favicon.ico ───────────────────────────────────────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }

    # ── Todo o resto → spsenai.arielaram.com ─────────────────────────────────
    location / {
        return 301 https://spsenai.arielaram.com$request_uri;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/arielaram.com.access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/arielaram.com.error.log  warn;
}
